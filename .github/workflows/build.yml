name: Windows build
on:
  push:
    paths: ['src/**', 'scripts/build.ps1', '.github/workflows/build.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build portable archive
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: JetPane-windows-x64
          path: |
            artifacts/JetPane-portable.zip
            artifacts/SHA256SUMS.txt
